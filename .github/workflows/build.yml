name: Build NixOS configs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hydra
            installable: nixosConfigurations.hydra.config.system.build.toplevel
          - name: bnas
            installable: nixosConfigurations.bnas.config.system.build.toplevel
          # Every flake input source tree, so later builds substitute them
          # from the cache instead of fetching from GitHub.
          - name: flake-inputs
            installable: packages.x86_64-linux.flake-inputs
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: NixOS/nix-installer-action@main

      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.fu.io

      - name: Build ${{ matrix.name }}
        run: |
          nix build '.#${{ matrix.installable }}'
